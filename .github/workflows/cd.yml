name: CD Pipeline

on:
  push:
    branches:
      - prod

env:
  IMAGE_NAME: examen-devops
  IMAGE_TAG: 1.0.1

jobs:

  # =========================
  # JOB 1 : SCAN AVANT DEPLOY
  # =========================
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Login Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Scan image from Docker Hub
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/examen-devops:1.0.1
          severity: CRITICAL
          exit-code: 1


  # =========================
  # JOB 2 : DEPLOY
  # =========================
  deploy:
    needs: scan
    runs-on: runner_prod   # ou runner-lab selon ton setup

    steps:
      - name: Login Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Pull image
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/examen-devops:1.0.1

      - name: Stop container
        run: |
          docker stop ci-app || true

      - name: Remove container
        run: |
          docker rm ci-app || true

      - name: Run container
        run: |
          docker run -d -p 80:80 --name ci-app \
          ${{ secrets.DOCKERHUB_USERNAME }}/examen-devops:1.0.1