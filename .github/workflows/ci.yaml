name: CI Pipeline

on:
  push:
    branches:
      - dev

env:
  IMAGE_NAME: examen-devops
  IMAGE_TAG: 1.0.1
  DOCKER_REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t examen-devops:1.0.1 .

      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: examen-devops:1.0.1
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Login Docker
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push image
        run: |
          docker tag examen-devops:1.0.1 ${{ secrets.DOCKERHUB_USERNAME }}/examen-devops:1.0.1
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/examen-devops:1.0.1

