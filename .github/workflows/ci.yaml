name: CI Pipeline

on:
  push:
    branches:
      - dev

env:
  IMAGE_NAME: examen-devops
  IMAGE_TAG: 1.0.1

jobs:

  # =========================
  # JOB 1 : BUILD
  # =========================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:$IMAGE_TAG .

      - name: Save image
        run: |
          docker save $IMAGE_NAME:$IMAGE_TAG -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar


  # =========================
  # JOB 2 : SCAN
  # =========================
  scan:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: image

      - name: Load image
        run: |
          docker load -i image.tar

      - name: Verify image
        run: docker images

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: examen-devops:1.0.1
          severity: CRITICAL
          exit-code: 1


  # =========================
  # JOB 3 : PUSH
  # =========================
  push:
    runs-on: ubuntu-latest
    needs: scan

    steps:
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: image

      - name: Load image
        run: |
          docker load -i image.tar

      - name: Show images
        run: docker images

      - name: Login Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Tag image correctly
        run: |
          IMAGE_ID=$(docker images -q | head -n 1)
          docker tag $IMAGE_ID ${{ secrets.DOCKERHUB_USERNAME }}/examen-devops:1.0.1

      - name: Push image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/examen-devops:1.0.1