name: CI Pipeline

on:
  push:
    branches:
      - dev

env:
  IMAGE_NAME: examen-devops
  IMAGE_TAG: 1.0.1
  DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t $IMAGE_NAME:$IMAGE_TAG .

      - name: Save image
        run: |
          docker save $IMAGE_NAME:$IMAGE_TAG -o image.tar

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar


  scan:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: image

      - name: Load image
        run: |
          docker load -i image.tar

      - name: Verify image exists
        run: docker images

      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: examen-devops:1.0.1
          severity: CRITICAL,HIGH
          exit-code: 1


  push:
    runs-on: ubuntu-latest
    needs: scan

    steps:
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: image

      - name: Load image
        run: |
          docker load -i image.tar

      - name: Verify images
        run: |
         docker images

      - name: Login Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Tag image correctly
        run: |
          docker tag examen-devops:1.0.1 ${{ secrets.DOCKERHUB_USERNAME }}/examen-devops:1.0.1

      - name: Push image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/examen-devops:1.0.1