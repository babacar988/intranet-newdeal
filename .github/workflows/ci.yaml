name: CI Pipeline

on:
  push:
    branches:
      - dev

env:
  IMAGE_NAME: examen-devops
  IMAGE_TAG: 1.0.1
  DOCKER_REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t $DOCKER_REGISTRY/$IMAGE_NAME:$IMAGE_TAG .

  scan:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "$DOCKER_REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
          severity: CRITICAL
          exit-code: 1

  push:
    runs-on: ubuntu-latest
    needs: scan

    steps:
      - name: Login Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "$DOCKER_REGISTRY" --password-stdin

      - name: Push image
        run: |
          docker push $DOCKER_REGISTRY/$IMAGE_NAME:$IMAGE_TAG